[project]
name = "google-agents-cli"
version = "1.3.1"
description = "Agents CLI — Agent Development Lifecycle toolchain for ADK"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Google LLC", email = "agents-cli-dev-pypi@google.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
  "click>=8.1.8,<9",
  "PyYAML>=6.0.2,<7",
  "cookiecutter>=2.6.0,<3",
  "jinja2>=3.1.0",
  "google-cloud-aiplatform[evaluation]>=1.156.0",
  "google-cloud-resource-manager>=1.12.0",
  "google-auth[pyopenssl]>=2.47.0",
  "rich>=13.7.0",
  "backoff>=2.2.1",
  "requests>=2.31.0",
  "a2a-sdk>=1.0,<2",
  "tomlkit>=0.13.0,<1",
  "psutil>=5.9.0",
  "python-dotenv>=1.0.0",
  "pathspec>=0.12.1",
]

[project.urls]
homepage = "https://github.com/google/agents-cli"
issues = "https://github.com/google/agents-cli/issues"
documentation = "https://google.github.io/agents-cli/"
releasenotes = "https://github.com/google/agents-cli/blob/main/RELEASE_NOTES.md"

[project.scripts]
agents-cli = "google.agents.cli.main:main"
google-agents-cli = "google.agents.cli.main:main"

[build-system]
requires = ["flit_core>=3.8,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "google.agents.cli"

[tool.flit.sdist]
include = [
  "src/google/agents/cli/scaffold/agents/",
  "src/google/agents/cli/scaffold/base_templates/",
  "src/google/agents/cli/scaffold/deployment_targets/",
  "src/google/agents/cli/scaffold/resources/",
  "src/google/agents/cli/scaffold/sample_data/",
  "skills/",
]

[project.optional-dependencies]
lint = [
    "ruff",
    "ty",
    "codespell",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-s -v --ignore=tests/integration --ignore=tests/cicd"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s - %(levelname)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-rerunfailures>=15.0",
    "pytest-xdist>=3.6.1",
    "pytest-cov>=4.1.0",
    "pyfakefs>=5.7.0",
]

[tool.ruff]
line-length = 90
target-version = "py311"
include = ["src/google/agents/cli/**/*.py", "tests/**/*.py", "tools/**/*.py"]
exclude = [
    "src/google/agents/cli/scaffold/agents",
    "src/google/agents/cli/scaffold/base_templates",
    "src/google/agents/cli/scaffold/deployment_targets",
    "tests/cicd/scripts",
]

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff specific rules
    "PLW1514", # unspecified-encoding (require encoding in open calls)
    "PLR0917", # too-many-positional-arguments
]
ignore = ["E501", "C901", "RUF001", "UP036", "RUF067", "RUF069"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR0917"]

[tool.ruff.lint.pylint]
max-positional-args = 5


[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# Exclude agent templates and cicd scripts from type checking
exclude = [
    "src/google/agents/cli/scaffold/agents/**",
    "src/google/agents/cli/scaffold/base_templates/**",
    "src/google/agents/cli/scaffold/deployment_targets/**",
    "tests/cicd/scripts/**",
]

[tool.ty.rules]
# Ignore missing third-party type stubs
unresolved-import = "ignore"

[[tool.ty.overrides]]
# Relax type checking for test files (pytest fixtures with yield have complex types)
include = ["tests/**"]
[tool.ty.overrides.rules]
invalid-return-type = "ignore"

[tool.codespell]
ignore-words-list = "rouge,afterall"
skip = "./locust_env/*,uv.lock,.venv,venv,**/*.ipynb,**/package-lock.json"

