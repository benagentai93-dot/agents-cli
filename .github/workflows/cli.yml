name: CLI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run --with ruff ruff check src tests

      - name: Type check
        run: uv run --with ty ty check src

      - name: Test
        run: uv run pytest tests

      - name: Build distributions
        run: uv build

      - name: Verify wheel-installed CLI
        run: uvx --from dist/*.whl agents-cli --version
